# Monthly PRs for npm and GitHub Actions updates, grouped so each ecosystem opens one PR. Each PR runs
# the check job; merging deploys. Security fixes open right away, outside the monthly schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for all non-major bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
      # Security fixes that land at the same time share one PR too.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # SvelteKit 3 and svelte-check peer on typescript ^6; drop this once they accept 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # checkout, setup-node and the artifact actions usually move together; one PR for all of them.
      actions:
        patterns: ["*"]
