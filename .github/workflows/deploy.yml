# PRs get migration checks, a type check, tests and a build. Pushes to main (PR merges) also deploy to
# the droplet: SSH through the Cloudflare Tunnel (ssh.eh-ai-blast.app), past a Cloudflare Access
# service token. The droplet's port 22 stays closed to the internet.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags: the deploy job can SSH to the droplet and sudo, so a
# moved tag would be root there. Dependabot bumps the SHA and the version comment together.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-migrations.sh diffs against the base commit
          persist-credentials: false # dependency code runs in this job; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Merged migrations are unchanged
        if: github.event_name != 'workflow_dispatch'
        run: bash ingest/check-migrations.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
      # Type-checks the app and ingest/ (JS via checkJs + JSDoc).
      - run: npm run check
      # ingest/ on node:test (a database from every migration, verify(), schema.ts matching it), then
      # the app on Vitest (src/lib, db.ts and route loaders against a fixture database).
      - run: npm test
      - run: npm run build

  # The app and ingest images (Dockerfile, ingest/Dockerfile). Every PR builds them; main pushes them to
  # GHCR tagged with the short commit SHA. The builds run dependency code, as the check job does, and
  # this job has no deploy credentials: only a token that can push these packages.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          tag=${GITHUB_SHA::7}
          docker build --build-arg APP_VERSION="$tag" -t "ghcr.io/evanh1393/ai-news-app-app:$tag" .
          docker build -f ingest/Dockerfile -t "ghcr.io/evanh1393/ai-news-app-ingest:$tag" .
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          tag=${GITHUB_SHA::7}
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "ghcr.io/evanh1393/ai-news-app-app:$tag"
          docker push "ghcr.io/evanh1393/ai-news-app-ingest:$tag"
          docker logout ghcr.io

  deploy:
    needs: [check, images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-droplet
      cancel-in-progress: false
    # Dependency code (install scripts, Vite plugins) only runs in the check and images jobs, which have
    # no deploy credentials. This job runs no npm code: the droplet pulls the images that job pushed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned binary, checked against the release's published SHA-256.
      - name: Install cloudflared
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          echo "d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      # deploy.sh talks to the "ai-briefing-do" host alias, same as from a laptop. cloudflared reads the
      # Access service token from TUNNEL_SERVICE_TOKEN_ID/SECRET, which ssh passes through to it.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp deploy/known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host ai-briefing-do
            HostName ssh.eh-ai-blast.app
            User evanh
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          EOF

      - run: bash deploy/deploy.sh
        env:
          TAG: ${{ github.sha }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
