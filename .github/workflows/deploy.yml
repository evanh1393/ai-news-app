# PRs and pushes to main get migration checks, a type check, tests and a build. Deploys are manual
# (`npm run deploy` from a laptop), since the droplet only takes SSH from the home IP.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags, so a moved tag can't change what runs. Dependabot bumps
# the SHA and the version comment together.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # check-migrations.sh diffs against the base commit
          persist-credentials: false # dependency code runs in this job; keep the token out of .git/config
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Merged migrations are unchanged
        if: github.event_name != 'workflow_dispatch'
        run: bash ingest/check-migrations.sh "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
      # Type-checks the app and ingest/ (JS via checkJs + JSDoc).
      - run: npm run check
      # Includes building a database from every migration, verify(), and schema.ts matching it.
      - run: npm test
      - run: npm run build
